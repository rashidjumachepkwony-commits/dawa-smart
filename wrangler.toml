# =============================================================
# Dawa Smart — Cloudflare Worker Configuration
# =============================================================
# Install: npm install -g wrangler
# Deploy:  wrangler deploy
# =============================================================

name = "dawa-smart-api"
main = "worker.js"
account_id = "0123627158662d9787fbcaed50687469"
compatibility_date = "2024-01-01"
workers_dev = true

# ------------------------------------------------------------
# Environment variables (safe to expose — just the URL)
# ------------------------------------------------------------
[vars]
ENV = "production"
SUPABASE_URL = "https://eooyeeanaojkrtyjswtw.supabase.co"

# Secrets (set via: wrangler secret put <NAME>)
# Required secrets:
#   - SUPABASE_ANON_KEY     — Supabase anonymous key (publishable)
#   - SUPABASE_SERVICE_ROLE — Supabase service_role key (NEVER expose to browser!)
#   - JWT_SECRET            — secret for signing auth tokens (already configured)
#   - MPESA_CONFIG_ENCRYPTION_KEY — base64-encoded random 32-byte AES-GCM key
#
# Set secrets with:
#   wrangler secret put SUPABASE_ANON_KEY
#   wrangler secret put SUPABASE_SERVICE_ROLE
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
#   wrangler secret put MPESA_CONFIG_ENCRYPTION_KEY
# Keep this encryption key backed up securely; rotating it requires re-encrypting
# every pharmacy's stored M-Pesa credentials before deploying the new key.
#
# ------------------------------------------------------------
# Routes (optional — configure if using a custom domain)
# ------------------------------------------------------------
# [[routes]]
# pattern = "api.startechafrica.co.ke/*"
# zone_id = "YOUR_ZONE_ID"

# ------------------------------------------------------------
# Deployment steps:
# 1. npm install -g wrangler
# 2. wrangler login
# 3. wrangler secret put SUPABASE_ANON_KEY
# 4. wrangler secret put SUPABASE_SERVICE_ROLE
# 5. wrangler secret put JWT_SECRET
# 6. Generate and securely back up a base64-encoded random 32-byte key.
# 7. wrangler secret put MPESA_CONFIG_ENCRYPTION_KEY
# 8. wrangler deploy
# ------------------------------------------------------------
